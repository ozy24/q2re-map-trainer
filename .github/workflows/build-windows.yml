name: Build Windows DLL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        run: |
          & $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        shell: pwsh

      - name: Build
        run: |
          $env:VCPKG_ROOT = "$env:GITHUB_WORKSPACE/vcpkg"
          cd src
          & $env:VCPKG_ROOT/vcpkg.exe install --triplet x64-windows-static
          msbuild game.sln /p:Configuration=Release /p:Platform=x64 /m
        shell: pwsh

      - name: Run trainer unit tests
        run: |
          & "$env:GITHUB_WORKSPACE/dist/trainer_tests_x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload game_x64.dll
        uses: actions/upload-artifact@v4
        with:
          name: game_x64
          path: dist/game_x64.dll
